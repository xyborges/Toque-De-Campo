server {
    listen 80 default_server;
    server_name 192.168.101.24;
    root /var/www/toque-de-campo;
    index index.html;
    autoindex off;
    server_tokens off;
    location = /accounts/api.php { return 426; }
    # Public CA bootstrap: verify its SHA-256 through a trusted channel.
    location = /accounts-ca.crt { try_files $uri =404; }
    location / { return 308 https://192.168.101.24$request_uri; }
}
server {
    listen 443 ssl;
    server_name 192.168.101.24;
    root /var/www/toque-de-campo;
    index index.html;
    autoindex off;
    server_tokens off;
    ssl_certificate /etc/toque-de-campo/tls/server.crt;
    ssl_certificate_key /etc/toque-de-campo/tls/server.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TDC:5m;
    ssl_session_tickets off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    client_max_body_size 32k;
    location = /accounts/api.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/toque-de-campo/accounts/api.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param TDC_ACCOUNTS_STORAGE /var/lib/toque-de-campo/accounts;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        add_header Cache-Control "no-store" always;
    }
    location /accounts/ { return 404; }
    location = /manifest.json { add_header Cache-Control "no-store" always; }
    location ~ /\. { deny all; }
    location ~ \.php$ { return 404; }
    location / { try_files $uri $uri/ =404; }
}
